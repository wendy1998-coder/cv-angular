<div class="card">
  <div class="card-header">
    <ul class="nav nav-tabs card-header-tabs">
      @for (tab of navTabs; track tab.name) {
        <li class="nav-item" role="presentation">
          <button
            type="button"
            role="tab"
            class="btn-link nav-link"
            [class.active]="activeTab === tab"
            (click)="setActiveTab(tab)"
          > {{ tab.name }} </button>
        </li>
      }
    </ul>
  </div>
  @if (activeTab) {
    <div class="card-body">
      <div class="mt-2">
        <p [innerHTML]="activeTab.content"></p>
      </div>
    </div>
  }
</div>
